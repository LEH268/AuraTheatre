<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Log In</title>
    <link rel="stylesheet" href="../Coding/css/log-in.css">
</head>
<body>
    <div class="container"> 
        <div class="form-area">
            <div class="left-bar">
                <img src="../Coding/image/cartoon for login.gif" alt="lock" style="max-width: 80%; height: auto;">
            </div>

            <form class="right-bar" onsubmit="return validateLogin()">
                <p>Welcome Back<br>Log in to your account to continue</p>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <div style="margin-bottom: 15px;">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                    <a href="sign up.html" style="float: right;">Forgot Password?</a>
                </div>

                <button type="submit" class="logInButton">Log in</button>
                <hr>
                <button type="button">Google</button>
                <button type="button">Facebook</button>

                <p style="margin-top: 20px;">
                    Don't have an account? <a href="sign up.html">Sign up now</a>
                </p>
            </form>
        </div>
    </div>

    <script src="log_in.js"></script>
</body>
</html>
